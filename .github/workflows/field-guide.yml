name: Field Guide

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check-guide:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Check out the proposed source
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check the committed offline guide
        run: python tools/build_public_guide.py --check
      - name: Test the public guide
        run: |
          test -f tests/test_public_guide.py
          python -m unittest discover -s tests -p "test_public_guide.py" -v
          python -m unittest discover -s tests -p "test_guide_books.py" -v
          python -m unittest discover -s tests -p "test_guide_editorial.py" -v
