<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="route-name route-desc">
<title id="route-name">Kyria village, the bridge and the two pits</title>
<desc id="route-desc">Cross the bridge from the entrance. The cat's pit leads by ladder to the mayor's house and the parrot. The chicken's pit is an optional 400-zenny cellar. Return to the entrance for the world-map road west to the Woods.</desc>
