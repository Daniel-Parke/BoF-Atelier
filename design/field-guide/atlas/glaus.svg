<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="route-name route-desc">
<title id="route-name">Mt. Glaus, from the entrance bridge to the den</title>
<desc id="route-desc">Climb the ramp beside the slide and cross the upper bridge to the hut. Broken trees lead to the cave. The summit is a detour for Vitamins. Inside, follow the blood to its end and retrace your steps. The upstream pool carries you behind the waterfall.</desc>
