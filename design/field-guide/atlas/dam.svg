<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="route-name route-desc"><title id="route-name">The Dam, which level holds each chest?</title><desc id="route-desc">The Short Sword is on the upper ledge past the first gate. Two Swallow Eyes are on the eastern upper ledge across the second gate. The lower flywheel exit gives access to two Vitamins. Cross the work camp bridge to return the key after collecting the three chests. The separate register represents elevations and decisions rather than a plan of connecting rooms.</desc><defs>
