  <pattern id="shale" width="17" height="11" patternUnits="userSpaceOnUse"><path d="m1 9 4-5m3 4 3-5m4 4 2-3" fill="none" stroke="#837c63" stroke-width=".8" opacity=".62"/></pattern>
