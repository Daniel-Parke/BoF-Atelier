<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="route-name route-desc">
<title id="route-name">Kyria Woods, from the apple tree to the falls</title>
<desc id="route-desc">The apple tree is at the entrance beside the woodsman. Follow the sign east to the well. Go underneath the broken bridge to leave the trap clearing. Jump the falls from bank to bank. A westward jump at the top reaches the Wisdom Seed. The north trail leads to the mayor.</desc>
<defs>
