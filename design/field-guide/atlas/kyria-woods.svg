<style>
  .topo,.line,.spur{fill:none;stroke-linecap:round;stroke-linejoin:round}.topo{stroke:#a69e79;stroke-width:1.2}
  .line{stroke:#396d5f;stroke-width:3}.spur{stroke:#966b3e;stroke-width:2.7;stroke-dasharray:5 5}
  .label{font:bold 21px Georgia,'Times New Roman',serif;fill:#33483c}.small{font:600 14px 'Segoe UI',Arial,sans-serif;fill:#3e5140}
  .label,.small{stroke:none}
  .selection{fill:none;stroke:#b35d39;stroke-width:3;opacity:0}.pin.active .selection,.pin:target .selection{opacity:1}
  .pin text{font:bold 17px 'Segoe UI',Arial,sans-serif;fill:#fff8e7;text-anchor:middle}
  .legend{font:600 13px 'Segoe UI',Arial,sans-serif;fill:#4b5445}
</style>
