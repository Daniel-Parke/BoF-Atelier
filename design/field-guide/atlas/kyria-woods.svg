  </g>
  <g id="pine" stroke-linejoin="round">
    <path d="M-1 2l1-31 3 1v30z" stroke="#766d50" fill="#827457"/><path d="m0-52-7 12 4-1-8 13 5-2-9 16 6-3-11 14 13-4 7 3 7-3 10 2-10-12 7 2-9-12 5 2-8-12 4 2z" fill="#779183" stroke="#586f60"/><path d="m0-43-2 8m3 0 5 10m-7 0-5 8m7 1 6 6" fill="none" stroke="#b4c5a8" stroke-width="1.4"/>
